probe_gatt:
  name: Probe GATT (development only)
  description: >-
    Development-only. With FORA 6 CONNECT visibly current in Advertisement
    Monitor, connect through Home Assistant Bluetooth and list GATT metadata only.
  fields:
    address:
      name: Bluetooth address (private)
      description: >-
        Development-only. Copy the Bluetooth address for FORA 6 CONNECT from
        Settings -> Connectivity -> Bluetooth -> Advertisement Monitor. The
        address is used only in memory for this probe and is not returned or
        persisted. Do not share it publicly.
      required: true
      selector:
        text: {}
observe_notifications:
  name: Observe notifications (development only)
  description: >-
    Development-only Stage 1C. Subscribe to the three known FORA 6 Connect
    Notify characteristics for 30 seconds. Bleak may configure CCCDs for
    subscription; no application characteristic write or read is sent.
    Returns counts and payload lengths only, never raw notification bytes.
  fields:
    address:
      name: Bluetooth address (private)
      description: >-
        Copy the known FORA 6 CONNECT address privately from Advertisement
        Monitor. Used only in memory for this observation; not returned,
        logged, or persisted. Do not share it publicly.
      required: true
      selector:
        text: {}
probe_protocol_identity:
  name: Probe protocol identity (development only)
  description: >-
    Development-only Stage 2E. Connect through Home Assistant Bluetooth,
    subscribe only to custom 1524, send the captured wake and project-query
    requests once each with write response, validate the replies and project
    0x4183, then unsubscribe and disconnect. No records are requested.
  fields:
    address:
      name: Bluetooth address (private)
      description: >-
        Copy the known FORA 6 CONNECT address privately from Advertisement
        Monitor. Used only in memory for this action; never returned, logged,
        or persisted. Do not share it publicly.
      required: true
      selector:
        text: {}
probe_protocol_record:
  name: Probe first stored record (development only)
  description: >-
    Development-only Stage 2F diagnostic. Confirm GD82 identity with captured
    wake and project queries, then query User1 record slots and only raw
    index zero through custom 1524. Returns status only, never health data.
    No clock setting, pairing, or production synchronization.
  fields:
    address:
      name: Bluetooth address (private)
      description: >-
        Copy the known FORA 6 CONNECT address privately from Advertisement
        Monitor. Used only in memory for this action; never returned, logged,
        or persisted. Do not share it publicly.
      required: true
      selector:
        text: {}
probe_history_window:
  name: Probe bounded history window (development only)
  description: >-
    Development-only Stage 7B. Confirm GD82 identity, query User1 raw slot
    metadata once, and read only the fixed raw-index sequence 1, 0, 1 when
    the raw slot count is exactly two. Returns structural and repeat-equality
    flags only; never a health value, timestamp, serial, address, or payload.
    No production synchronization or automatic repeat.
  fields:
    address:
      name: Bluetooth address (private)
      description: >-
        Copy the runtime meter address privately from Advertisement Monitor.
        It is used only in memory for this manually invoked action; never
        returned, logged, or persisted.
      required: true
      selector:
        text: {}
probe_history_semantics:
  name: Probe bounded history semantics (development only)
  description: >-
    Development-only Stage 7C. Confirm GD82 identity, require exactly two
    User1 raw slots, and classify only the fixed raw-index sequence 1, 0, 1.
    Returns classification and status booleans only. No health value,
    timestamp, payload, or production synchronization is exposed.
  fields:
    address:
      name: Bluetooth address (private)
      description: >-
        Copy the runtime meter address privately from Advertisement Monitor.
        It is used only in memory for this manual action and is never returned,
        logged, or persisted.
      required: true
      selector:
        text: {}
probe_history_window_four:
  name: Probe four-slot history window (development only)
  description: >-
    Development-only Stage 7E. Confirm GD82 identity, query User1 raw slot
    metadata once, and read only indexes 3, 0, 1, 2, 3 when count is exactly
    four. Returns structure and equality flags only. No health values,
    timestamps, identifiers, persistence, or production synchronization.
  fields:
    address:
      name: Bluetooth address (private)
      description: >-
        Copy the runtime meter address privately from Advertisement Monitor.
        Used only in memory for this manual action; never returned or logged.
      required: true
      selector:
        text: {}
refresh_current_uric_acid:
  name: Refresh current uric acid
  description: >-
    Turn the FORA 6 Connect meter on normally, do not browse stored records
    with its arrow keys, then run this action. Refreshes the existing uric-acid
    sensor for supported two- or four-slot memory only. The private response
    includes the selected value and meter-local time.
  fields:
    config_entry_id:
      name: FORA 6 Connect entry
      description: Choose the configured meter to refresh.
      required: true
      selector:
        config_entry:
          integration: fora6_connect
observe_advertisements:
  name: Observe Bluetooth advertisements (development only)
  description: >-
    Development-only, read-only 60-second observation. Select the configured
    FORA 6 Connect entry, then perform safe normal OFF and ON cycles. Compares
    repeated advertisement receipt where the installed Home Assistant version
    supports it, with live changed-data callbacks. Makes no Bluetooth
    connection and does not refresh the sensor. Returns only counts, relative
    times, and structural shapes; no address or payload.
  fields:
    config_entry_id:
      name: FORA 6 Connect entry
      description: Choose the configured meter to observe.
      required: true
      selector:
        config_entry:
          integration: fora6_connect
observe_advertisement_rearm:
  name: Observe advertisement re-arm (development only)
  description: >-
    Development-only 60-second callback observation. Start with the meter OFF,
    run this action, then turn it ON normally and keep it continuously ON.
    After the first changed-data callback, the action clears Home Assistant's
    advertisement history exactly once and watches for another callback.
    It does not connect to the meter or refresh the sensor. A later OFF-to-ON
    episode can be checked with the separate Observe Bluetooth advertisements
    action. Return data contains only structural and relative-time evidence.
  fields:
    config_entry_id:
      name: FORA 6 Connect entry
      description: Choose the configured meter to observe.
      required: true
      selector:
        config_entry:
          integration: fora6_connect
probe_transaction_readiness:
  name: Probe transaction readiness (development only)
  description: >-
    Development-only, one-attempt Bluetooth check for the configured FORA 6
    Connect meter. Connects and tests notification subscription, then
    disconnects. Sends no meter command and does not refresh the sensor.
    For the normal-ON control, turn the meter on normally and avoid its
    history arrows. A post-measurement comparison should occur only after a
    measurement taken for normal use.
  fields:
    config_entry_id:
      name: FORA 6 Connect entry
      description: Choose the configured meter to check.
      required: true
      selector:
        config_entry:
          integration: fora6_connect
probe_history_chronology:
  name: Inspect two primary records (private development action)
  description: >-
    Development-only Stage 7G. After confirming GD82 identity and exactly four
    User1 raw slots, read only primary indexes 0 and 2. Return semantic gates
    and relative meter-local time order. For validated General uric-acid primaries,
    also return private mg/dL values and timezone-unknown meter-local times.
    This response contains private health data; do not share it publicly.
    No identifiers, persistence, entity update, or production synchronization.
  fields:
    address:
      name: Bluetooth address (private)
      description: >-
        Copy the runtime meter address privately from Advertisement Monitor.
        Used only in memory for this manual action; never returned or logged.
      required: true
      selector:
        text: {}
probe_serial_identity:
  name: Probe serial identity (development only)
  description: >-
    Development-only Stage 6A1. Connect through Home Assistant Bluetooth,
    read standard Device Information Serial Number String 0x2A25 exactly
    once, and disconnect. Returns structural status only; never returns,
    logs, or persists the serial or address. No FORA command, write,
    notification subscription, pairing, or automatic repeat read.
  fields:
    address:
      name: Bluetooth address (private)
      description: >-
        Copy the known meter address privately from Advertisement Monitor.
        Used only in memory as a connection locator. Do not share it publicly.
      required: true
      selector:
        text: {}
probe_serial_stability:
  name: Compare serial stability (development only)
  description: >-
    Development-only Stage 6A1b. Read standard Device Information Serial
    Number String 0x2A25 once per invocation. Set one private reference in
    Home Assistant process memory or compare a new read against it. Returns
    equality only, never the serial, digest, length, or address. No FORA
    command, write, notification subscription, pairing, or persistence.
  fields:
    address:
      name: Bluetooth address (private)
      description: >-
        Copy the runtime meter address privately from Advertisement Monitor.
        It is not returned or persisted.
      required: true
      selector:
        text: {}
    operation:
      name: Operation
      description: >-
        Set or replace the process-local reference, or compare one new read.
      required: true
      selector:
        select:
          options:
            - set_reference
            - compare
probe_system_id:
  name: Probe System ID (development only)
  description: >-
    Development-only Stage 6B2. Read standard Device Information System ID
    0x2A23 exactly once and return structural status only. No raw value,
    digest, address, FORA command, write, notification, or pairing is exposed.
  fields:
    address:
      name: Bluetooth address (private)
      description: >-
        Use the runtime meter locator privately. It is never returned or stored.
      required: true
      selector:
        text: {}
probe_system_id_stability:
  name: Compare System ID stability (development only)
  description: >-
    Development-only Stage 6B2. Read 0x2A23 once per invocation, set one
    process-local private reference, or compare exact raw bytes with it.
    Only equality and structural flags are returned. No persistence or writes.
  fields:
    address:
      name: Bluetooth address (private)
      description: >-
        Use the runtime meter locator privately. It is never returned or stored.
      required: true
      selector:
        text: {}
    operation:
      name: Operation
      description: Set a process-local reference or compare one read with it.
      required: true
      selector:
        select:
          options:
            - set_reference
            - compare
